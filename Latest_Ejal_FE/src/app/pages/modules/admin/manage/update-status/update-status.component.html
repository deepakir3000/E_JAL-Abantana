<div class="card">
  <div class="card-header">
      <div class="card-title">Update Application Status
          <span class="back-button" title="Go Back">
              <i class="fa fa-reply "></i>
              <span>Back</span>
          </span>
      </div>
  </div>
  <div class="card-body">
          <div class="row">
              <div class="col-sm-6 offset-sm-3">
                  <div class="form-group row required">
                      <label for="stateId" class="col-sm-4 col-form-label">Application Id888</label>
                      <div class="col-sm-8">
                          <input type="text" class="form-control" (keyup)="getAppID($event)">
                      </div>
                  </div>
              </div>
          </div>
          <div align="center">
              <button type="button" (click)="updateStatus()" class="btn btn-primary">Update</button>
          </div>
  </div>
</div>
