<div class="card">
    <div class="card-header">
        <div class="card-title text-capitalize">{{pathType}} User
            <span class="back-button" title="Go Back" (click)="backButton()">
                  <i class="fa fa-reply "></i>
                  <span>Back</span>
            </span>
        </div>
    </div>
    <div class="card-body">
        <form [formGroup]="userForm" (ngSubmit)="submitUserData(userForm.value)">
            <div class="row">
                <!-- <div class="col-sm-6">
                <div class="form-group row required">
                    <label  class="col-sm-4 col-form-label">User ID</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control">
                    </div>
                </div>
            </div> -->
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Username</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" formControlName="userName">
                            <small class="text-error ml-3" *ngIf="userForm.controls.userName.touched && userForm.controls.userName.invalid">
                                <span class="text-danger" *ngIf="userForm.controls.userName.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="userForm.controls.userName.errors?.pattern">not a valid entry</span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Fullname</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" formControlName="displayName">
                            <small class="text-error ml-3" *ngIf="userForm.controls.displayName.touched && userForm.controls.displayName.invalid">
                                <span class="text-danger" *ngIf="userForm.controls.displayName.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="userForm.controls.displayName.errors?.pattern">not a valid entry</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Mobile No</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" formControlName="phone" maxlength="10">
                            <small class="text-error ml-3" *ngIf="userForm.controls.phone.touched && userForm.controls.phone.invalid">
                                <span class="text-danger" *ngIf="userForm.controls.phone.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="userForm.controls.phone.errors?.pattern">not a valid mobile no.</span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">E-mail</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" formControlName="email">
                            <small class="text-error ml-3" *ngIf="userForm.controls.email.touched && userForm.controls.email.invalid">
                                <span class="text-danger" *ngIf="userForm.controls.email.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="userForm.controls.email.errors?.pattern">not a valid email</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Role</label>
                        <div class="col-sm-8">
                            <select class="form-control" formControlName="roleId">
                                        <option value="">Select Any One</option>
                                        <option *ngFor="let roles of roleDetails" value="{{roles.id}}">{{roles.role_name}}</option>
                                        <!-- <option value="1">System Admin</option>
                                        <option value="2">Officer</option> -->
                                    </select>
                                    <small class="text-error ml-3" *ngIf="userForm.controls.roleId.touched && userForm.controls.roleId.invalid">
                                        <span class="text-danger" *ngIf="userForm.controls.roleId.errors?.required">Required</span>
                                    </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Status</label>
                        <div class="col-sm-8">
                            <select class="form-control" formControlName="status">
                                <option value="">Select Any One</option>
                                <option value="1">Active</option>
                                <option value="2">Inactive</option>
                            </select>
                            <small class="text-error ml-3" *ngIf="userForm.controls.status.touched && userForm.controls.status.invalid">
                                <span class="text-danger" *ngIf="userForm.controls.status.errors?.required">Required</span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" *ngIf="pathType !== 'edit'">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" formControlName="password" autocomplete="off">
                            <small class="text-error ml-3" *ngIf="userForm.controls.password.touched && userForm.controls.password.invalid">
                                <span class="text-danger"
                                    *ngIf="userForm.controls.password.errors?.required">Required</span>
                                <span class="text-danger"
                                    *ngIf="userForm.controls.password.errors?.pattern">Password is weak or not valid</span>
                                <span *ngIf="userForm.controls.password.errors?.pattern"><i
                                        style="font-size: 20px; margin-left: 10px; cursor: pointer;"
                                        class="fa fa-info-circle" title="Password must contains one digit from 0-9, one lowercase characters, 
                                    one uppercase characters, one special symbols from (@#$%) 
                                    and the length should be at least 6 characters."></i></span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Confirm Password</label>
                        <div class="col-sm-8">
                            <input type="password" class="form-control" formControlName="confirmPassword" autocomplete="off">
                            <small class="text-error ml-3" *ngIf="userForm.controls.confirmPassword.touched && userForm.controls.confirmPassword.invalid">
                                <span class="text-danger"
                                    *ngIf="userForm.controls.confirmPassword.errors?.required">Required</span>
                                <span class="text-danger"
                                    *ngIf="userForm.controls.confirmPassword.errors?.pattern">Password is weak or not valid</span>
                                <span *ngIf="userForm.controls.confirmPassword.errors?.pattern"><i
                                        style="font-size: 20px; margin-left: 10px; cursor: pointer;"
                                        class="fa fa-info-circle" title="Password must contains one digit from 0-9, one lowercase characters, 
                                    one uppercase characters, one special symbols from (@#$%) 
                                    and the length should be at least 6 characters."></i></span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <div class="row" *ngIf="pathType === 'edit'">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Upload Image</label>
                        <div class="col-sm-8">
                            <input type="file" class="form-control" accept="image/*" (change)="fileChange($event)" title="Choose File To Upload..">
                        </div>
                    </div>
                </div>
            </div> -->
            <div class="mt-2" align="center">
                <button type="button" class="btn btn-warning" (click)="roleFormReset()">Reset</button>
                <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid || userForm.pristine">Submit</button>
                <button type="button" *ngIf="pathType === 'edit'" class="btn btn-md btn-info" (click)="enableEdit()">Edit</button>
            </div>
        </form>
    </div>
</div>
