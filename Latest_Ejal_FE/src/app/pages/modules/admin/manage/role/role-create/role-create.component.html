<div class="card">
    <div class="card-header">
        <div class="card-title text-capitalize">{{pathType}} User
            <span class="back-button" title="Go Back" (click)="backButton()">
                  <i class="fa fa-reply "></i>
                  <span>Back</span>
            </span>
        </div>
    </div>
    <div class="card-body">
        <form [formGroup]="roleFormGroup" (ngSubmit)="createRoleDeatils(roleFormGroup.value)">
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label for="stateId" class="col-sm-4 col-form-label">Role Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" formControlName="roleName">
                            <small class="text-error ml-3" *ngIf="roleFormGroup.controls.roleName.touched && roleFormGroup.controls.roleName.invalid">
                                <span class="text-danger" *ngIf="roleFormGroup.controls.roleName.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="roleFormGroup.controls.roleName.errors?.pattern">not a valid entry</span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label for="stateId" class="col-sm-4 col-form-label">Status</label>
                        <div class="col-sm-8">
                            <select class="form-control" formControlName="status">
                          <option value="">Select Any One</option>
                          <option value="1">Active</option>
                          <option value="2">Inactive</option>
                      </select>
                      <small class="text-error ml-3" *ngIf="roleFormGroup.controls.status.touched && roleFormGroup.controls.status.invalid">
                        <span class="text-danger"
                            *ngIf="roleFormGroup.controls.status.errors?.required">Required</span>
                    </small>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <div class="row">
                <div class="col-sm-6">
                <div class="form-group row required">
                    <label for="stateId" class="col-sm-4 col-form-label">Organisation Name</label>
                    <div class="col-sm-8">
                        <select class="form-control">
                          <option value="">DOWR</option>
                      </select>
                    </div>
                </div>
            </div>
                <div class="col-sm-6">
                   
                </div>
            </div> -->
            <div align="center">
                <button type="button" class="btn btn-warning" (click)="roleFormReset()">Reset</button>
                <button type="submit" [disabled]="!roleFormGroup.valid" class="btn btn-primary" [disabled]="roleFormGroup.invalid || roleFormGroup.pristine">Submit</button>
                <button type="button" *ngIf="pathType === 'edit'" class="btn btn-md btn-info" (click)="enableEdit()">Edit</button>
            </div>
        </form>
    </div>
</div>
