<div class="row justify-content-center">
</div>
<div class="card">
    <div class="card-header">
        <div class="card-title"> Resource Details</div>
    </div>
    <!-- <div class="card-body"> -->
    <div class="card-body">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group row  ml-0 mr-0 outside">
                    <div class="input-group ">
                        <div class="input-group-prepend">
                            <i class="input-group-text input-group-text fa fa-search"></i>
                        </div>
                        <input type="text" autocomplete="off" aria-autocomplete="none" class="form-control" placeholder="Search Role">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="row justify-content-end ml-0 mr-0">
                    <div class="btn-group btn-controls">
                        <button type="button" class="btn btn-primary" (click)="goToPage()">
                                <i class="fa fa-plus"></i> Create
                            </button>
                        <button type="button" class="btn btn-warning" (click)="goToEditPage()">
                                <i class="fa fa-edit"></i> Edit
                            </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div class="row pl-3">
            <div class="col-xl-6">
                <div class="form-group row pl-3">
                    Show
                    <div class="col-sm-3">
                        <select class="form-control" id="dh">
                                <option *ngFor="let option of paginationLength" [value]="option">{{option}}
                                </option>
                            </select>
                    </div>
                    entries
                </div>
            </div>
        </div> -->
        <div class="table-responsive">
            <table class="table  table-bordered">
                <!-- table headers -->
                <thead>
                    <tr>
                        <th>Sl.No</th>
                        <th>Name</th>
                        <th>Path</th>
                        <th>Description</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    <tr *ngFor="let data of resourceList | paginate: {id:'totalResourceList', itemsPerPage: resourcePageSize, currentPage: resourcePageNo, totalItems: resourceTotalElements}; let i = index" [ngClass]="{'selected': data.resource_name === selectedName}" (click)="selectTableData(data)">
                        <td>{{((resourcePageNo -1) * selectedPageSize) + i+1}}</td>
                        <td>{{data.resource_name}}</td>
                        <td>{{data.link_text}}</td>
                        <td>{{data.resource_description}}</td>
                        <td>Active</td>
                        <td *ngIf="!data.status === 1">Inactive</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- pagination controls -->
        <div class="row">
            <!-- <div class="col-12">
                        <div class="bg-white text-center">
                            <pagination-controls id="totalRoleList" autoHide="true"
                                (pageChange)="setPageDetails(pageNo, $event, searchRoleText)" maxSize="3"></pagination-controls>
                        </div>
                    </div> -->
            <div class="col-6">
                <div class="bg-white text-left">
                    <span>
                            Total Records: <b>{{resourceTotalElements}}</b>
                        </span>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-white text-right">
                    <pagination-controls id="totalResourceList" autoHide="true" (pageChange)="setPageDetails(resourcePageNo, $event)" maxSize="3"></pagination-controls>

                </div>
            </div>
        </div>
    </div>
</div>
<!-- </div> -->
