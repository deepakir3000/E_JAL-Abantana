<div class="card">
    <div class="card-header">
        <div class="card-title">{{operationModType}} Basin
            <span class="back-button" title="Go Back" (click)="backButton()">
          <i class="fa fa-reply "></i>
          <span>Back</span>
            </span>
        </div>
    </div>
    <div class="card-body">
        <form [formGroup]="basinForm" (ngSubmit)="submitOperationDetails(basinForm.value)">
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label for="stateId" class="col-sm-4 col-form-label">Basin Name</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" formControlName="basinName">
                            <small class="text-error ml-3" *ngIf="basinForm.controls.basinName.touched && basinForm.controls.basinName.invalid">
                                <span class="text-danger"
                                    *ngIf="basinForm.controls.basinName.errors?.required">Required</span>
                                    <span class="text-danger" *ngIf="basinForm.controls.basinName.errors?.pattern">not
                                        a valid entry </span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group row required">
                        <label class="col-sm-4 col-form-label">Status</label>
                        <div class="col-sm-8">
                            <select class="form-control" formControlName = "status">
                          <option value="">Select Any One</option>
                          <option value="1">Active</option>
                          <option value="2">Not Active</option>
                      </select>
                      <small class="text-error ml-3" *ngIf="basinForm.controls.status.touched && basinForm.controls.status.invalid">
                        <span class="text-danger"
                            *ngIf="basinForm.controls.status.errors?.required">Required</span>
                    </small>
                        </div>
                    </div>
                </div>
            </div>
            <div align="center">
                <button type="button" class="btn btn-warning">Reset</button>
                <button type="submit" class="btn btn-primary" [disabled]="basinForm.invalid || basinForm.pristine">Submit</button>
            </div>
        </form>
    </div>
</div>
