<!-- district card details -->
<div class="card">
    <!-- card title -->
    <div class="card-header">
        <div class="card-title">{{districtModType}} District Details
            <span class="back-button" title="Go Back" (click)="backButton()">
                        <i class="fa fa-reply "></i>
                        <span>Back</span>
            </span>
        </div>

    </div>
    <!-- card body -->
    <div class="card-body">
        <form [formGroup]="districtForm" (ngSubmit)="submitDistrictDetails(districtForm.value)">
            <div class="row">
                <div class="col-xl-6">
                    <!-- Division Name -->
                    <div class="form-group row required">
                        <label for="stateId" class="col-sm-4 col-form-label">State Name </label>
                        <div class="col-sm-8">
                            <select class="form-control" id="stateId" formControlName="stateId">
                                <option value="">Select Any One</option>
                                <option *ngFor="let option of state" [value]="option.id">{{option.state_name}}</option>
                            </select>
                            <small class="text-error" *ngIf="districtForm.controls.stateId.touched && districtForm.controls.stateId.invalid">
                                <span *ngIf="districtForm.controls.stateId.errors?.required">not a valid state name</span>
                                <span *ngIf="districtForm.controls.stateId.errors?.invalidField">not a valid state name</span>
                            </small>
                        </div>
                    </div>

                </div>
                <div class="col-xl-6">
                    <div class="form-group row required">
                        <label for="districtName" class="col-sm-4 col-form-label">District Name </label>
                        <div class="col-sm-8">
                            <input type="text" autocomplete="off" aria-autocomplete="none" formControlName="districtName" class="form-control" id="districtName" placeholder="District Name">
                            <small class="text-error" *ngIf="districtForm.controls.districtName.touched && districtForm.controls.districtName.invalid">
                                <span *ngIf="districtForm.controls.districtName.errors?.required">*Required</span>
                                <span *ngIf="districtForm.controls.districtName.errors?.invalidField">not a valid district name</span>
                                <span *ngIf="districtForm.controls.districtName.errors?.invalidName">Not a valid district name</span>
                            </small>
                        </div>
                    </div>
                </div>
                <!-- <div class="col-xl-6" *ngIf="pathType === 'edit'">
                    <div class="form-group row">
                        <label for="statusId" class="col-sm-4 col-form-label">Status </label>
                        <div class="col-sm-8">
                            <select class="form-control" id="statusId" formControlName="statusId">
                                <option value="">Select any one</option>
                                <option *ngFor="let option of status" [value]="option.statusId">{{option.status}}</option>
                            </select>
                            <small class="text-error" *ngIf="districtForm.controls.statusId.touched && districtForm.controls.statusId.invalid">
                                <span *ngIf="districtForm.controls.statusId.errors?.required">not a valid Status</span>
                                <span *ngIf="districtForm.controls.statusId.errors?.invalidField">not a valid Status</span>
                            </small>
                        </div>

                    </div>

                </div> -->
            </div>
            <!-- form submit button -->
            <div align="center">
                <button type="button" (click)="resetButton()" class="btn btn-warning">Reset</button>
                <button [disabled]='districtForm.invalid' type="submit" class="btn btn-primary">Submit</button>
                <button type="button" class="btn btn-md btn-info" (click)="enableEdit()">Edit</button>
            </div>
        </form>
    </div>
</div>
