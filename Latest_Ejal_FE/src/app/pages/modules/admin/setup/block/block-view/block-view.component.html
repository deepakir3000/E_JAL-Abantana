<!-- block view details -->
<div class="card">
    <!-- card details -->
    <div class="card-header">
        <div class="card-title">Block/ULB Details
            <span *ngIf="isLookUpBackAllowed" class="back-button" title="Go Back" (click)="goBackToPage()">
                <i class="fa fa-reply "></i>
                <span>Back</span>
            </span>
        </div>
    </div>
    <!-- card body -->
    <div class="card-body">
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group row  ml-0 mr-0 outside">
                    <div class="input-group ">
                        <div class="input-group-prepend">
                            <i class="input-group-text fa fa-search"></i>
                        </div>
                        <input type="text" autocomplete="off" aria-autocomplete="none" class="form-control" placeholder="Search By Block/ULB name...." [(ngModel)]="searchBlock">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="row justify-content-end mr-0 mr-0">
                    <!-- block details modification controls -->
                    <div class="btn-group btn-controls">
                        <!-- add block details -->
                        <button type="button" class="btn btn-primary" (click)="openCreateBlockDetailsPage()"><i
                                class="fa fa-plus"></i>Create</button>
                        <!-- edit block details -->
                        <button type="button" class="btn btn-warning" (click)="goToEditPage()"><i
                                class="fa fa-edit"></i>Edit</button>
                        <!-- delete block details -->
                        <!-- <button type="button" class="btn btn-danger"><i class="fa fa-trash"></i>Delete</button> -->
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-xl-6">
                <div class="form-group row pl-3">
                    Show
                    <div class="col-sm-3">
                        <select class="form-control" id="dh" [(ngModel)]="selectedPageSize" (change)="changePageSize()">
                            <option *ngFor="let option of pageSize" [value]="option">{{option}}</option>
                        </select>
                    </div>
                    entries
                </div>
            </div>
        </div>
        <!-- circle details list -->
        <div class="table-responsive">
            <table class="table  table-bordered">
                <!-- table headers -->
                <thead>
                    <tr>
                        <th class="text-center">Sl.No</th>
                        <th class="text-center">State</th>
                        <th class="text-center">District</th>
                        <th class="text-center">Block</th>
                        <!-- <th class="text-center">Status</th> -->
                    </tr>
                </thead>
                <!-- table body -->
                <tbody>
                    <tr *ngFor="let data of block | paginate: {id:'totalBlockList', itemsPerPage: blockPageSize, currentPage: blockPageNo, totalItems: blockTotalElements }; let i = index" [ngClass]="{'selected': data.block_name === selectedName}" (click)="selectTableData(data)">
                        <!-- <tr *ngFor="let data of block" [ngClass]="{'selected': data.checked}"> -->

                        <td class="text-center">{{((blockPageNo -1) * blockPageSize) + i+1}}</td>
                        <td class="text-center">{{data.state_name}}</td>
                        <td class="text-center">{{data.district_name}}</td>
                        <td class="text-center">{{data.block_name}}</td>
                        <!-- <td class="text-center">{{data.status}}</td> -->

                    </tr>
                </tbody>
            </table>
        </div>
        <!-- pagination controls -->
        <div class="row">
            <div class="col-6">
                <div class="bg-white text-left">
                    <span>
                        Total Records: <b>{{blockTotalElements}}</b>
                    </span>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-white text-right">
                    <pagination-controls id="totalBlockList" autoHide="true" (pageChange)="setPageDetails(blockPageNo, $event)" maxSize="3"></pagination-controls>
                </div>
            </div>
        </div>
    </div>
</div>
