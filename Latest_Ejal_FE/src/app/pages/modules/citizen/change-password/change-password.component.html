<div class="container top-container">
    <div class="">
        <div class="field-container">
            <div class="row">
                <!-- <div class="row">
                    <div class="col-12">
                        <h4>Change Password</h4>
                    </div>
                </div> -->
                <div class="col-md-5">
                    <div class="">
                        <img  src="./../../../../../assets/images/change-password.jpg">
                    </div>
                </div>
                <div class="col-md-7" style="padding-top: 2rem;">
                    <div class="">
                        <h4>Change Password</h4>
                    </div>
                    <div class="mt-4">
                        <form [formGroup]="changePassForm" (ngSubmit)="checkPassword(changePassForm.value)">
                            <div class="row mt-lg-4">
                                <div class="col-5">
                                    <label>Current Password</label>
                                </div>
                                <div class="col-7">
                                    <input type="password" class="form-control" formControlName="oldPassword" autocomplete="off">
                                    <small class="text-error ml-3"
                                        *ngIf="changePassForm.controls.oldPassword.touched && changePassForm.controls.oldPassword.invalid">
                                        <span class="text-danger"
                                            *ngIf="changePassForm.controls.oldPassword.errors?.required">Required</span>
                                            <span class="text-danger" *ngIf="changePassForm.controls.oldPassword.errors?.pattern">not
                                                a valid entry </span>
                                    </small>
                                </div>
                            </div>
                            <div class="row mt-lg-4">
                                <div class="col-5">
                                    <label>New Password</label>
                                </div>
                                <div class="col-7">
                                    <input type="password" class="form-control" formControlName="password" autocomplete="off">
                                </div>
                            </div>
                            <small class="text-error ml-3"
                                *ngIf="changePassForm.controls.password.touched && changePassForm.controls.password.invalid">
                                <span class="text-danger"
                                    *ngIf="changePassForm.controls.password.errors?.required">Required</span>
                                <span class="text-danger" *ngIf="changePassForm.controls.password.errors?.pattern">Password
                                    is weak</span>
                                <span *ngIf="changePassForm.controls.password.errors?.pattern"><i
                                        style="font-size: 20px; margin-left: 10px; cursor: pointer;"
                                        class="fa fa-info-circle" title="Password must contains one digit from 0-9, one lowercase characters, 
                                    one uppercase characters, one special symbols from (@#$%) 
                                    and the length should be at least 6 characters."></i></span>
                            </small>
                            <div class="row mt-lg-4">
                                <div class="col-5">
                                    <label>Confirm Password</label>
                                </div>
                                <div class="col-7">
                                    <input type="password" class="form-control" formControlName="confirmPass" autocomplete="off">
                                    <small class="text-error ml-3"
                                        *ngIf="changePassForm.controls.confirmPass.touched && changePassForm.controls.confirmPass.invalid">
                                        <span class="text-danger"
                                            *ngIf="changePassForm.controls.confirmPass.errors?.required">Required</span>
                                            <span class="text-danger" *ngIf="changePassForm.controls.confirmPass.errors?.pattern">Password
                                                is weak</span>
                                            <span class="text-danger" *ngIf="changePassForm.controls.confirmPass.errors?.pattern"><i
                                                style="font-size: 20px; margin-left: 10px; cursor: pointer;"
                                                class="fa fa-info-circle" title="Password must contains one digit from 0-9, one lowercase characters, 
                                            one uppercase characters, one special symbols from (@#$%) 
                                            and the length should be at least 6 characters."></i> </span>
                                    </small>
                                </div>
                            </div>
                            <div class="row mt-4">
                                <div class="col-12" style="text-align: center;">
                                    <button type="submit" [disabled]="changePassForm.invalid"
                                        class="custom-btn">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- <div class="row">
                <div class="col-12">
                    <img src="./../../../../../assets/images/management.svg">
                </div>
            </div> -->
        </div>
    </div>
</div>
