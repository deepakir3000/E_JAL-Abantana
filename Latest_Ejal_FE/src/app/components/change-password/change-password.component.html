<div class="row top-bg">
    <div class="col-sm-4">
        <div class="row">
            <div class="col-3 od-logo">
                <img src="assets/icon/odisha_logo_blue.png">
            </div>
            <div class="col-9 wtr-logo">
                <img src="assets/images/WaterLogin/Govt. of Odisha.png">
            </div>
        </div>
    </div>
    <div class="col-sm-8">
        <div class="row mb-5 mr-3">
            <div class="col-12">
                <span class="back-button" title="Go Back" (click)="backButton()">
                    <i class="fa fa-reply "></i>
                    <span>Back</span>
                </span>
            </div>
        </div>
    </div>
</div>
<div class="conatiner top-container">
    <div class="row">
        <div class="col-4 field-container">
            <div class="row">
                <div class="col-12">
                    <img src="./../../../../../assets/images/management.svg">
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <h4>Change Password</h4>
                </div>
            </div>
            <form [formGroup]="changePassForm" (ngSubmit)="checkPassword(changePassForm.value)">
                <div class="row mt-lg-5">
                    <div class="col-5">
                        <label>Current Password</label>
                    </div>
                    <div class="col-7">
                        <input type="password" class="form-control" formControlName="oldPassword" autocomplete="off">
                    </div>
                </div>
                <small class="text-error ml-3"
                    *ngIf="changePassForm.controls.oldPassword.touched && changePassForm.controls.oldPassword.invalid">
                    <span class="text-danger"
                        *ngIf="changePassForm.controls.oldPassword.errors?.required">Required</span>
                </small>
                <div class="row mt-lg-4">
                    <div class="col-5">
                        <label>New Password</label>
                    </div>
                    <div class="col-7">
                        <input type="password" class="form-control" formControlName="password" autocomplete="off">
                    </div>
                </div>
                <small class="text-error ml-3"
                    *ngIf="changePassForm.controls.password.touched && changePassForm.controls.password.invalid">
                    <span class="text-danger" *ngIf="changePassForm.controls.password.errors?.required">Required</span>
                    <span class="text-danger" *ngIf="changePassForm.controls.password.errors?.pattern">Password is
                        weak</span>
                    <span *ngIf="changePassForm.controls.password.errors?.pattern"><i
                            style="font-size: 20px; margin-left: 10px; cursor: pointer;" class="fa fa-info-circle"
                            title="Password must contains one digit from 0-9, one lowercase characters, 
                        one uppercase characters, one special symbols from (@#$%) 
                        and the length should be at least 6 characters."></i></span>
                </small>
                <div class="row mt-lg-4">
                    <div class="col-5">
                        <label>Confirm Password</label>
                    </div>
                    <div class="col-7">
                        <input type="password" class="form-control" formControlName="confirmPass" autocomplete="off">
                    </div>
                </div>
                <small class="text-error ml-3"
                    *ngIf="changePassForm.controls.password.touched && changePassForm.controls.password.invalid">
                    <span class="text-danger" *ngIf="changePassForm.controls.password.errors?.required">Required</span>
                </small>
                <!-- <div class="form-group row">
                    <div class="col-5 px-0">
                        <div class="" #captcha></div>
                    </div>
                    <div class="col-1 px-0">
                        <i class="fa fa-refresh captch-style" aria-hidden="true" (click)="getCaptcha()"></i>
                    </div>
                    <div class="col-6 px-0">
                        <input type="text" style="margin-top: 15px; margin-left: -15px;" class="form-control" formControlName="captchaVal" placeholder="Enter Captcha">
                    </div>
                </div>
                <small class="text-error ml-3" *ngIf="changePassForm.controls.captchaVal.touched && changePassForm.controls.captchaVal.invalid">
                    <span class="text-danger"
                        *ngIf="changePassForm.controls.captchaVal.errors?.required">Required</span>
                </small> -->
                <div class="row">
                    <div class="col-12" style="text-align: center;">
                        <button type="submit" [disabled]="changePassForm.invalid" class="custom-btn">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
