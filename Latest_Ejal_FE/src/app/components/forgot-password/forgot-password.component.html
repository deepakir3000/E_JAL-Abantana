<div class="fp-outer-container">
    <div class="d-flex justify-content-center align-items-center w-100 h-100 fp-inner-container">
        <div class="col-xl-4 col-md-4 fp-login-container">
            <div class="fp-image-loc">
                <img class="fp-image" src="assets/images/lock.png" />
            </div>
            <div class="fp-titles">
                <div class="heading">Forgot Password</div>
                <div class="sub-heading">Enter the following details to change it</div>
            </div>
            <div class="fp-form">
                <form [formGroup]="forgotPassForm"  class="text-left">
                    <div class="form-group">
                        <label>User Name</label>
                        <div class="row ml-0 mr-0">
                            <div class="col-10 pl-0 pr-0">
                                <input formControlName="userId" type="text" autocomplete="off" aria-autocomplete="none" class="form-control rounded-0" placeholder="User Name." >
                            </div>
                            <div class="col-2 pl-0 pr-0">
                                <button type="button" class="btn btn-primary rounded-0" (click)="sendOtp(forgotPassForm.value)" >SEND</button>
                            </div>
                        </div>
                       
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input formControlName="password" type="password" autocomplete="off" aria-autocomplete="none" class="form-control rounded-0" placeholder="New Password.">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input formControlName="cnfPass" type="password" autocomplete="off" aria-autocomplete="none" class="form-control rounded-0" placeholder="Confirm Password.">
                    </div>
                    <div class="form-group">
                        <label>OTP</label>
                        <div class="input-group">
                            <input formControlName="otp" type="password" autocomplete="off" aria-autocomplete="none" class="form-control rounded-0" placeholder="OTP" maxlength="6">
                            <div class="input-group-addon btn btn-primary rounded-0">
                                <i class="fa fa-refresh"> Resend</i>
                            </div>
                        </div>
                    </div>
                    <div class="form-group row justify-content-center mt-3">
                        <button class="btn btn-danger" type="submit">Submit</button>
                    </div>

                    <div class="form-group row justify-content-center mt-3">
                      <a href="javascript:void();" [routerLink]="['/login']">Go to Login Page</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
