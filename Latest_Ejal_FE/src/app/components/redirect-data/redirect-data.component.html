
<div class="container-fluid main-container px-0 mb-3" style="border-bottom: 5px solid blue;">
  <div class="row">
    <div class="col-md-4">
      <div class="row">
        <div class="col-3 od-logo"><img src="assets/icon/odisha_logo_blue.png"></div>
        <div class="col-9 wtr-logo"><img src="assets/images/WaterLogin/Govt. of Odisha.png"></div>
      </div>
    </div>
    <div class="col-sm-7 offset-sm-1 right-menu ng-star-inserted">
      <div class="row">
        <div class="col-sm-12 px-0">
          <div class="row welcom-menu">
            <div class="col-2"><img class="profile-img" src="assets/images/profile.svg"></div>
            <div class="col-10" style="text-align: center;">
              <div class="row mt-4"> Welcome To </div>
              <div class="row mt-0 text-capitalize"> Online Water Allocation System </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>
<div class="container">
  <input type="number" class="form-control" placeholder="Search by Application ID" [(ngModel)]="searchText" />
  <h2>List of Approved Applications </h2>
  <div class="" style="height: 50vh; overflow-y: scroll;">
    <table class="table table-sm table-striped table-bordered table-hover custom-th">
      <thead >
        <th>S.no</th>
        <th>Application ID</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Fee (in INR)</th>
      </thead>
      <tr class="text-center" *ngFor="let tableData of tableData | searchText:searchText ;  let i = index" >
        <td>{{ i + 1 }}</td>
        <td>{{ tableData.id | maskId }}</td>
        <td>{{ tableData.start_date | date: 'dd-MM-yyyy' }}</td>
        <td>{{ tableData.end_date | date: 'dd-MM-yyyy' }}</td>
        <td>1000</td>
      </tr>
    </table>
  </div>
</div>
