<div class="row ml-0 mr-0 justify-content-center">
    <div class="col-xl-12 col-lg-12 col-md-12">
        <div class="row error-page">
            <div class="col-xl-7 error-img">
                <img src="assets/error/404_error.gif" class="image">
            </div>
            <div class="col-xl-5 error-content">
                <div class="error-heading">
                    <div class="header1">Error !</div>
                </div>
                <div class="error-code">
                    <div class="code">4</div>
                    <div class="code">0</div>
                    <div class="code">4</div>
                </div>
                <div class="error-heading">
                    <div class="header2">Page Not Found</div>
                </div>
                <div class="error-desc">
                    <div class="desc1">Sorry, We can't find that page!</div>
                    <div class="desc2">Either something went wrong or page doesn't exist anymore</div>
                </div>
                <div class="error-backBtn">
                    <button type="button" class="btn btn-primary" ><i class="fa fa-home"></i>&nbsp;Return Home</button>
                </div><!-- (click)="goToHome()" -->
            </div>
        </div>
    </div>
</div>
