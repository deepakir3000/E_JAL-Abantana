export default "<ngx-spinner bdOpacity=0.5 bdColor=\"rgba(0,0,0,0.8)\" size=\"default\" color=\"#fff\" type=\"line-spin-clockwise-fade\" [fullScreen]=\"true\">\r\n    <p style=\"color: white;\"> Please wait... </p>\r\n</ngx-spinner>\r\n<div *ngIf=\"auth\">\r\n    <router-outlet></router-outlet>\r\n</div>\r\n<!-- <app-chatbot></app-chatbot> -->\r\n<div *ngIf=\"!auth\" class=\"text-center\">\r\n    <p class=\"text-danger\">Refused To Connect</p>\r\n</div>"
